; PlatformIO build file (optional: you can also open firmware/teensy_ffb/teensy_ffb.ino
; in the Arduino IDE with Teensyduino installed).
;
; Build + upload from a terminal:   pio run -t upload
; Open the serial calibration menu: pio device monitor

[platformio]
; The code lives in an Arduino-style sketch folder so both tools can use it.
src_dir = firmware/teensy_ffb

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
; USB_FFB_WHEEL = our "Serial + FFB Wheel" USB type: game controller with force
; feedback, plus a Serial port for the settings menu. The extra script below adds
; it to PlatformIO's copy of the Teensy core automatically before each build.
; (Use -D USB_SERIAL_HID instead for the stock joystick without force feedback.)
build_flags = -D USB_FFB_WHEEL
extra_scripts = pre:tools/pio_patch_core.py
monitor_speed = 115200
